<div class="container my-5 py-4">
  <div class="text-center mb-5">
    <h1 class="fw-bold text-dark">GET IN TOUCH</h1>
    <p class="text-muted">Have inquiries regarding ingredients, catering, or deliveries? Drop us a line.</p>
    <div class="mx-auto mt-3" style="width: 50px; height: 3px; background-color: #041935;"></div>
  </div>

  <div class="row g-5">
    <div class="col-lg-5">
      <div class="p-4 rounded-3 h-100 border text-white" style="background-color: #041935;">
        <h3 class="fw-bold mb-4">Contact Information</h3>
        <div class="mb-4">
          <h6 class="fw-bold mb-1 text-warning">Email Channels</h6>
          <p class="mb-0">support&#64;ministryofflavors.com</p>
        </div>
        <div>
          <h6 class="fw-bold mb-1 text-warning">Support Operations</h6>
          <p class="mb-0">Monday – Sunday</p>
          <small class="opacity-75">10:00 AM – 11:00 PM EST</small>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="p-4 border rounded-3 bg-white shadow-sm">
        <h3 class="fw-bold mb-4 text-dark">Send a Message</h3>
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" class="form-control rounded-2 py-2" placeholder="Your Name">
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control rounded-2 py-2" placeholder="Email Address">
            </div>
            <div class="col-12">
              <textarea class="form-control rounded-2 py-2" rows="4" placeholder="How can our team help you?"></textarea>
            </div>
            <div class="col-12 mt-4">
              <button type="button" class="btn btn-dark w-100 py-2 rounded-2 fw-bold">Send Message</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
