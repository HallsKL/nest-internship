<div class="container my-5 py-5">
  
  <a class="btn btn-outline-dark mb-5 rounded-pill px-4" routerLink="/products">
    ← Back to Collection
  </a>

  @if (product) {
    <div class="row g-5 align-items-center">
      
      <div class="col-md-6 text-center">
        <div class="p-4 bg-white border rounded-3 shadow-sm d-flex align-items-center justify-content-center" style="height: 500px;">
          <img [src]="product.image" class="img-fluid h-100" style="object-fit: contain; max-height: 450px;" [alt]="product.title">
        </div>
      </div>

      <div class="col-md-6">
        <span class="badge bg-secondary mb-2 text-uppercase px-3 py-2 fs-7">{{ product.category }}</span>
        <h1 class="display-5 fw-bold text-dark mb-3">{{ product.title }}</h1>
        
        <div class="fs-3 fw-bold text-dark mb-4">${{ product.price }}</div>
        
        <h5 class="fw-bold text-secondary border-bottom pb-2">Product Description</h5>
        <p class="lead text-muted lh-base mb-4">{{ product.description }}</p>

        <div class="mb-4">
          <label class="form-label fw-bold small text-secondary">Select Size</label>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-dark rounded-circle px-3 py-2">S</button>
            <button class="btn btn-outline-dark rounded-circle px-3 py-2 active">M</button>
            <button class="btn btn-outline-dark rounded-circle px-3 py-2">L</button>
            <button class="btn btn-outline-dark rounded-circle px-2 py-2">XL</button>
          </div>
        </div>

        <button class="btn btn-dark btn-lg w-100 rounded-pill py-3 fw-bold shadow-sm">
          Add To Cart / Secure Purchase
        </button>
      </div>

    </div>
  } @else {
    <div class="text-center py-5">
      <div class="spinner-border text-dark" role="status"></div>
      <p class="text-muted mt-2">Retrieving item catalog specs...</p>
    </div>
  }
</div>
