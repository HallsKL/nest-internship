<div class="container my-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold text-dark">DYNAMIC HOODIE CATALOG</h2>
    <p class="text-muted">These items are being pulled in real-time from a live Fake API endpoint.</p>
    <div class="mx-auto mt-2" style="width: 50px; height: 3px; background-color: #000;"></div>
  </div>
  
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    
    @for (hoodie of hoodieList; track hoodie.id) {
      <div class="col">
        <div class="card h-100 product-card shadow-sm border-0">
          
          <div class="position-relative overflow-hidden" style="height: 280px; background-color: #fff;">
            <img [src]="hoodie.image" class="card-img-top product-img p-3 w-100 h-100" style="object-fit: contain;" [alt]="hoodie.title">
          </div>
          
          <div class="card-body d-flex flex-column bg-light">
            <h6 class="card-title fw-bold text-dark text-truncate" [title]="hoodie.title">
              {{ hoodie.title }}
            </h6>
            <p class="card-text text-muted small flex-grow-1 text-truncate-2">
              {{ hoodie.description }}
            </p>
            
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-2">
              <span class="fs-5 fw-bold text-dark">${{ hoodie.price }}</span>
              <button class="btn btn-dark btn-sm rounded-pill px-3" [routerLink]="['/products', hoodie.id]">View Details</button>
            </div>
          </div>

        </div>
      </div>
    } @empty {
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-dark" role="status">
          <span class="visually-hidden">Loading hoodie assets...</span>
        </div>
        <p class="text-muted mt-2">Connecting to Fake API backend...</p>
      </div>
    }

  </div>
</div>
